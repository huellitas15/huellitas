<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conoce esta historia de rescate animal de Huellas Felices.">
  <title>Campaña | Huellas Felices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #242a26; background: #fbfaf8; --green: #02a95c; --dark: #008748; --muted: #647168; --border: #e8e6e1; }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.65; }
    a { color: inherit; text-decoration: none; }
    .nav { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); z-index: 2; }
    .nav-inner, main, footer { width: min(1050px, calc(100% - 36px)); margin: auto; }
    .nav-inner { min-height: 68px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 800; font-size: 19px; }
    .back { color: var(--dark); font-weight: 700; }
    main { padding: 34px 0 70px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, .8fr); gap: 30px; align-items: start; }
    .card { background: white; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 18px #1838200b; }
    .gallery { position: relative; }
    .photo { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; background: #eef2ef; }
    .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; }
    .thumbs button { border: 2px solid transparent; border-radius: 8px; padding: 0; width: 66px; height: 54px; flex: 0 0 auto; overflow: hidden; background: #eee; cursor: pointer; }
    .thumbs button[aria-pressed="true"] { border-color: var(--green); }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; }
    .content { padding: 26px; }
    .badge { display: inline-block; padding: 5px 12px; border-radius: 99px; background: #e8f7f0; color: var(--dark); font-size: 13px; font-weight: 700; }
    h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.2; margin: 14px 0 22px; letter-spacing: -.03em; }
    h2 { font-size: 22px; line-height: 1.3; margin: 26px 0 12px; }
    .story p { white-space: pre-line; margin: 0 0 16px; }
    .highlight { padding: 18px 20px; margin: 20px 0; border-left: 4px solid var(--green); background: #eff8f2; border-radius: 0 10px 10px 0; font-weight: 600; }
    .side { padding: 24px; }
    .status { color: var(--dark); font-weight: 800; }
    .amount { font-size: 28px; font-weight: 800; margin-top: 16px; }
    .muted { color: var(--muted); font-size: 14px; }
    .track { height: 10px; background: #e9eee9; border-radius: 99px; overflow: hidden; margin: 12px 0; }
    .bar { height: 100%; width: 0; background: var(--green); }
    .stats { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; }
    .payment { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
    .payment p { margin: 8px 0; overflow-wrap: anywhere; }
    .paypal { display: inline-block; margin-top: 12px; padding: 11px 18px; border-radius: 99px; color: white; background: var(--green); font-weight: 700; }
    .share-button { border: 0; cursor: pointer; font: inherit; }
    .update { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .update:last-child { border: 0; }
    .donor { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .error { padding: 24px; color: #9c292d; background: white; border: 1px solid var(--border); border-radius: 12px; }
    footer { padding: 22px 0 34px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .side { order: -1; } .content, .side { padding: 20px; } main { padding-top: 20px; } }
  </style>
</head>
<body>
  <header class="nav"><div class="nav-inner"><a class="brand" href="./">♥ Huellas Felices</a><a class="back" href="./#campanas">← Todas las historias</a></div></header>
  <main id="app"><p class="muted">Cargando historia…</p></main>
  <footer>Huellas Felices · Historias de rescate, cuidado y nuevas oportunidades.</footer>
  <script src="./api-config.js"></script>
  <script src="./compartir.js"></script>
  <script>
    'use strict';
    const root = document.getElementById('app');
    const text = (tag, className, value) => {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = value;
      return element;
    };
    const paragraphs = value => value.split(/\n\s*\n/).filter(Boolean).map(value => text('p', '', value));
    const money = value => '$' + Number(value || 0).toLocaleString('es-EC', { maximumFractionDigits: 2 });
    async function loadCampaign() {
      const slug = new URLSearchParams(location.search).get('id');
      if (!slug || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) throw new Error('El enlace de la campaña no es válido.');
      const api = window.HUELLAS_API_URL || '';
      if (!api || api.includes('TU-WORKER')) throw new Error('El sitio todavía no tiene configurada la conexión a la base de datos.');
      const response = await fetch(api.replace(/\/+$/, '') + '/api/campaigns/' + encodeURIComponent(slug));
      const campaign = await response.json();
      if (!response.ok) throw new Error(campaign.error || 'No se pudo cargar la campaña.');
      document.title = campaign.title + ' — ' + (campaign.brand || 'Huellas Felices');
      const description = document.querySelector('meta[name="description"]');
      description.content = campaign.story.replace(/\s+/g, ' ').slice(0, 155);

      const layout = document.createElement('div');
      layout.className = 'layout';
      const article = document.createElement('article');
      article.className = 'card';
      const gallery = document.createElement('div');
      gallery.className = 'gallery';
      const photos = [campaign.photo1, campaign.photo2, campaign.photo3,
        ...(campaign.additionalPhotos || []).map(photo => photo.url)].filter(Boolean);
      const hero = document.createElement('img');
      hero.className = 'photo';
      hero.src = photos[0] || '';
      hero.alt = campaign.title;
      gallery.append(hero);
      if (photos.length > 1) {
        const thumbs = document.createElement('div');
        thumbs.className = 'thumbs';
        photos.forEach((url, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-pressed', String(index === 0));
          const image = document.createElement('img');
          image.src = url;
          image.alt = 'Foto ' + (index + 1);
          button.append(image);
          button.addEventListener('click', () => {
            hero.src = url;
            thumbs.querySelectorAll('button').forEach((item, current) =>
              item.setAttribute('aria-pressed', String(current === index)));
          });
          thumbs.append(button);
        });
        gallery.append(thumbs);
      }
      const content = document.createElement('div');
      content.className = 'content';
      content.append(text('span', 'badge', campaign.status === 'completada' ? 'Caso completado' : campaign.category));
      content.append(text('h1', '', campaign.title));
      const story = document.createElement('section');
      story.className = 'story';
      story.append(text('h2', '', campaign.storyTitle || 'Su historia'), ...paragraphs(campaign.story));
      if (campaign.highlight) story.append(text('div', 'highlight', campaign.highlight));
      story.append(...paragraphs(campaign.storyEnding || ''));
      content.append(story);
      const updates = document.createElement('section');
      if ((campaign.updates || []).length) {
        updates.append(text('h2', '', 'Actualizaciones'));
        campaign.updates.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach(update => {
          const entry = text('div', 'update', '');
          entry.append(text('strong', '', update.title), text('p', '', update.description),
            text('small', 'muted', new Date(update.date + 'T12:00:00').toLocaleDateString('es')));
          updates.append(entry);
        });
        content.append(updates);
      }
      article.append(gallery, content);

      const side = document.createElement('aside');
      side.className = 'card side';
      if (campaign.status === 'completada') {
        side.append(text('div', 'status', '✓ Caso completado'),
          text('h2', '', 'Meta alcanzada'),
          text('div', 'amount', money(campaign.goal) + ' USD'),
          text('p', 'muted', (campaign.shareCount || '0') + ' veces compartido'));
      } else {
        side.append(text('div', 'status', campaign.organizer || campaign.brand),
          text('p', 'muted', campaign.organizerDescription || 'Organizador verificado'),
          text('div', 'amount', money(campaign.raised) + ' USD'),
          text('div', 'muted', 'recaudados de ' + money(campaign.goal) + ' USD'));
        const track = document.createElement('div');
        track.className = 'track';
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.width = Math.min(100, Number(campaign.raised) / Math.max(1, Number(campaign.goal)) * 100) + '%';
        track.append(bar);
        side.append(track);
        const stats = document.createElement('div');
        stats.className = 'stats';
        const shareCount = text('span', '', (campaign.shareCount || '0') + ' veces compartido');
        let currentShareCount = Number(campaign.shareCount) || 0;
        stats.append(text('span', '', (campaign.donationCount || '0') + ' donaciones'), shareCount);
        side.append(stats);
        const shareButton = text('button', 'paypal share-button', 'Compartir campaña');
        shareButton.type = 'button';
        const shareStatus = text('p', 'muted', '');
        shareStatus.setAttribute('role', 'status');
        shareButton.addEventListener('click', () => {
          shareStatus.textContent = '';
          compartirCampanaPublica(slug, count => {
            currentShareCount = Math.max(currentShareCount, count);
            shareCount.textContent = currentShareCount + ' veces compartido';
          }, (message, error) => {
            if (error) shareStatus.textContent += (shareStatus.textContent ? ' ' : '') + message;
            else if (!shareStatus.textContent) shareStatus.textContent = message;
          });
        });
        side.append(shareButton, shareStatus);
        const payment = document.createElement('section');
        payment.className = 'payment';
        payment.append(text('h2', '', 'Cómo ayudar'));
        const accountNumber = (campaign.accountNumber || '').trim();
        const paypalUser = (campaign.paypal || '').trim();
        if (accountNumber) {
          payment.append(text('p', '', (campaign.bankName || 'Transferencia bancaria') +
            (campaign.accountType ? ' · ' + campaign.accountType : '')),
            text('p', '', 'Cuenta: ' + accountNumber));
          if (campaign.accountHolder) payment.append(text('p', '', 'Titular: ' + campaign.accountHolder));
          if (campaign.accountId) payment.append(text('p', '', (campaign.accountIdType === 'ruc' ? 'RUC: ' : 'Cédula: ') + campaign.accountId));
        }
        if (paypalUser) {
          const paypal = document.createElement('a');
          paypal.className = 'paypal';
          paypal.href = 'https://paypal.me/' + encodeURIComponent(paypalUser);
          paypal.target = '_blank';
          paypal.rel = 'noopener';
          paypal.textContent = 'Donar con PayPal';
          payment.append(paypal);
        }
        if (!accountNumber && !paypalUser) {
          payment.append(text('p', 'muted', 'Esta campaña aún no tiene métodos de pago configurados.'));
        }
        side.append(payment);
      }
      if ((campaign.donors || []).length && campaign.status === 'vigente') {
        const donors = document.createElement('section');
        donors.className = 'payment';
        donors.append(text('h2', '', 'Donadores recientes'));
        campaign.donors.forEach(donor => {
          const row = text('div', 'donor', '');
          row.append(text('span', '', donor.name || 'Anónimo'), text('strong', '', money(donor.amount)));
          donors.append(row);
        });
        side.append(donors);
      }
      layout.append(article, side);
      root.replaceChildren(layout);
    }
    loadCampaign().catch(error => root.replaceChildren(text('p', 'error', error.message)));
  </script>
</body>
</html>
